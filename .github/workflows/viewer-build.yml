name: Viewer build

on:
  pull_request:
    paths:
      - "site/**"
      - "bundles/**"
      - ".github/workflows/viewer-build.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "bundles/**"
      - ".github/workflows/viewer-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package.json
      - name: Install
        run: npm install
      - name: Audit generic renderer
        run: npm run audit:generic
      - name: Audit learner-facing labels
        run: node scripts/audit-learner-labels.mjs
      - name: Build
        run: npm run build
      - name: Install final rendered-label audit runtime
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Final rendered learner-label audit
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/viewer-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/audit-rendered-labels-final.mjs
      - name: Validate Cloudflare deploy config
        run: npx wrangler deploy --dry-run
